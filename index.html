<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>기본도형 작도 연습 v2</title>
<style>
:root{
  --bg:#f6f4ea;--card:#fffdf7;--ink:#222;--accent:#2f6f62;--soft:#dfeee9;
  --blue:#1565c0;--green:#3a7b67;--red:#d34e32;--muted:#777;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px;border-bottom:1px solid #ddd8cc;background:rgba(246,244,234,.97);position:sticky;top:0;z-index:3}
h1{margin:0;font-size:clamp(22px,3vw,34px)} .sub{font-size:14px;color:#666;margin-top:4px}
.wrap{max-width:1100px;margin:auto;padding:16px}
.tabs,.tools,.bottom,.compassModes{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:750;background:#ece8df;color:#222;cursor:pointer;touch-action:manipulation}
button.active{background:var(--accent);color:#fff}
.panel{background:var(--card);border:1px solid #ddd6ca;border-radius:18px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}
.mission{font-size:18px;font-weight:800}
.status{padding:10px 12px;background:#f0eee8;border-radius:10px;margin-bottom:10px;min-height:42px}
.status.ok{background:#e5f5e7;color:#246a38}.status.bad{background:#f8e7e2;color:#8a3a28}
.canvasbox{width:100%;aspect-ratio:16/10;position:relative;background:#fff;border:2px solid #bbb4a6;border-radius:14px;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

/* 상단 도구를 아이콘형으로 compact하게 */
.controlsHead{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding-bottom:2px}
.controlsHead::-webkit-scrollbar{height:6px}
.controlsHead::-webkit-scrollbar-thumb{background:#d0c8ba;border-radius:999px}
.controlsBlock{display:flex;flex-direction:column;gap:6px;flex:1 1 auto;min-width:0}
.tools.iconbar{display:flex;gap:5px;flex-wrap:nowrap;align-items:center;overflow-x:auto;padding-bottom:2px}
.tools.iconbar::-webkit-scrollbar{height:6px}
.tools.iconbar::-webkit-scrollbar-thumb{background:#d0c8ba;border-radius:999px}
.toolIconBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 4px;min-height:46px;min-width:54px;border-radius:12px;flex:0 0 auto}
.toolIconBtn .toolIcon{font-size:18px;line-height:1;margin-bottom:2px}
.toolIconBtn .toolLabel{font-size:10px;font-weight:800;line-height:1.05}
.controlsSub{font-size:12px;font-weight:800;color:#555;min-width:30px;padding-top:0}
.mission{font-size:14px;font-weight:800;white-space:nowrap;padding-right:0}
.colorRow{display:none}
.tools.palette{display:flex;gap:5px;flex-wrap:nowrap;align-items:center;margin-left:2px}
.colorBtn{width:28px;height:28px;padding:0;border-radius:999px;border:2px solid rgba(0,0,0,.08);font-size:0;min-width:28px;flex:0 0 auto}
.colorBtn.active{outline:2px solid #222;outline-offset:1px}
.colorBtn::after{content:''}
.compactDivider{width:1px;height:28px;background:#d9d2c6;margin:0 2px;flex:0 0 auto}

.compassBar{display:none;margin:6px 0 8px;padding:8px 10px;border-radius:12px;background:#eef4f1;border:1px solid #d3e2dc}
.compassBar.show{display:block}
.compassTitle{font-weight:800;margin-bottom:6px;font-size:13px}
.compassModes{gap:6px}
.compassModes button{padding:6px 8px;font-size:12px}
.hint{margin-top:10px;padding:12px;background:#f7f1df;border-left:5px solid #d6ad49;border-radius:10px;line-height:1.6}
.small{font-size:11px;color:#666;margin-top:6px;line-height:1.4}
.badge{display:inline-block;border-radius:999px;padding:2px 7px;background:#e8eee9;color:#355f55;font-weight:700}

@media(max-width:640px){
  .canvasbox{aspect-ratio:4/5}
  button{font-size:13px;padding:9px 11px}
  .mission{font-size:13px}
  .toolIconBtn{min-width:50px;min-height:44px;padding:4px 3px}
  .toolIconBtn .toolIcon{font-size:17px}
  .toolIconBtn .toolLabel{font-size:9px}
  .colorBtn{width:26px;height:26px;min-width:26px}
}

.shareTop{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.shareBtn{background:#315f95;color:#fff}
.fullBtn{background:#4a4a4a;color:#fff}
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modalOverlay.show{display:flex}
.shareModal{width:min(520px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.25)}
.shareModal h2{margin:0 0 8px;font-size:23px}
.shareModal p{margin:6px 0 12px;color:#555;line-height:1.5}
.shareInputRow{display:flex;gap:8px}
.shareInputRow input{flex:1;min-width:0;border:1px solid #bbb;border-radius:10px;padding:11px;font-size:15px}
.qrWrap{display:flex;justify-content:center;align-items:center;min-height:230px;margin:14px 0;background:#fafafa;border:1px dashed #ccc;border-radius:14px;padding:12px}
#qrBox img,#qrBox canvas{max-width:210px!important;max-height:210px!important}
.modalBtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.copyOk{color:#246a38;font-weight:700;min-height:22px}
@media(max-width:640px){.shareTop{width:100%}.shareTop button{flex:1}}

</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
    <div>
      <h1>자와 컴퍼스로 작도 연습</h1>
      <div class="sub">직선·반직선·선분·점·컴퍼스를 사용하고 색상도 선택할 수 있습니다.</div>
    </div>
    <div class="shareTop">
      <button id="shareOpenBtn" class="shareBtn">학생에게 공유</button>
      <button id="fullscreenBtn" class="fullBtn">전체화면</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="tabs">
    <button id="t0" class="active">1. 선분 길이 옮기기</button>
    <button id="t1">2. 각 옮기기</button>
    <button id="t2">교과서 1</button>
    <button id="t3">교과서 3</button>
    <button id="t4">교과서 4</button>
    <button id="t5">번외. 수직이등분선</button>
  </div>

  <div class="panel">
    <div class="controlsHead">
      <div class="controlsBlock">
        <div class="mission" id="mission"></div>
        <div class="tools iconbar" id="colorTools">
          <button id="lineBtn" class="toolIconBtn active" title="직선"><span class="toolIcon">📏</span><span class="toolLabel">직선</span></button>
          <button id="rayBtn" class="toolIconBtn" title="반직선"><span class="toolIcon">↗️</span><span class="toolLabel">반직선</span></button>
          <button id="segmentBtn" class="toolIconBtn" title="선분"><span class="toolIcon">／</span><span class="toolLabel">선분</span></button>
          <button id="compassBtn" class="toolIconBtn" title="컴퍼스"><span class="toolIcon">🧭</span><span class="toolLabel">컴퍼스</span></button>
          <button id="pointBtn" class="toolIconBtn" title="점"><span class="toolIcon">●</span><span class="toolLabel">점</span></button>
          <button id="intersectionBtn" class="toolIconBtn" title="교점"><span class="toolIcon">✚</span><span class="toolLabel">교점</span></button>
          <span class="compactDivider"></span>
          <button class="colorBtn active" data-color="#1565c0" aria-label="파랑" title="파랑" style="background:#1565c0"></button>
          <button class="colorBtn" data-color="#d34e32" aria-label="빨강" title="빨강" style="background:#d34e32"></button>
          <button class="colorBtn" data-color="#2e7d32" aria-label="초록" title="초록" style="background:#2e7d32"></button>
          <button class="colorBtn" data-color="#111111" aria-label="검정" title="검정" style="background:#111"></button>
          <button class="colorBtn" data-color="#8e44ad" aria-label="보라" title="보라" style="background:#8e44ad"></button>
        </div>
      </div>
    </div>

    <div id="compassBar" class="compassBar">
      <div class="compassTitle">컴퍼스 조작</div>
      <div class="compassModes">
        <button id="cmMove" class="active">이동</button>
        <button id="cmOpen">간격</button>
        <button id="cmArc">호</button>
      </div>
      <div class="small">
        <span class="badge">이동</span> 위치 변경 &nbsp;
        <span class="badge">간격</span> 반지름 조절 &nbsp;
        <span class="badge">호</span> 필요한 만큼만 그리기
      </div>
    </div>



    <div id="status" class="status">도구를 선택하고 작도해 보세요.</div>

    <div class="canvasbox" id="box"><canvas id="cv"></canvas></div>

    <div class="bottom" style="margin-top:10px">
      <button id="hintBtn">힌트</button>
      <button id="undoBtn">되돌리기</button>
      <button id="resetBtn">처음부터</button>
      <button id="checkBtn">정답 확인</button>
      <button id="zoomOutBtn">축소 −</button>
      <button id="zoomResetBtn">100%</button>
      <button id="zoomInBtn">확대 +</button>
    </div>

    <div id="hint" class="hint" hidden></div>
  </div>
</div>


<div id="shareOverlay" class="modalOverlay" aria-hidden="true">
  <div class="shareModal">
    <h2>학생에게 공유</h2>
    <p id="shareInfo">웹에 올린 주소를 QR코드와 링크로 학생들에게 공유할 수 있습니다.</p>
    <div class="shareInputRow">
      <input id="shareUrlInput" type="url" placeholder="공유할 웹주소를 입력하세요">
      <button id="makeQrBtn">QR 만들기</button>
    </div>
    <div class="qrWrap"><div id="qrBox">QR코드가 여기에 표시됩니다.</div></div>
    <div id="copyMsg" class="copyOk"></div>
    <div class="modalBtns">
      <button id="nativeShareBtn">공유창 열기</button>
      <button id="copyLinkBtn">링크 복사</button>
      <button id="shareCloseBtn">닫기</button>
    </div>
  </div>
</div>

function normAng(a){while(a<=-Math.PI)a+=Math.PI*2;while(a>Math.PI)a-=Math.PI*2;return a}

function base(){
 if(lesson===0)return{A:pt(W*.17,H*.24),B:pt(W*.36,H*.24),P:pt(W*.18,H*.72)};

function snapCandidates(){
  const g=base();
  const pts=[];
  // 4번은 교과서 그림만 사용하고 숨은 점 스냅은 제거
  if(lesson!==4){
    Object.values(g).forEach(v=>{
      if(v && typeof v.x==='number' && typeof v.y==='number') pts.push(v);
    });
  }
  // 학생이 직접 찍은 점
  actions.filter(a=>a.t==='p').forEach(a=>pts.push(a.p));
  return pts;
}
function nearestSnap(p, threshold=22){
  let best=null, bestD=threshold;
  for(const q of snapCandidates()){
    const dd=dist(p,q);
    if(dd<bestD){best=q;bestD=dd}
  }
  return best;
}

function projectToLine(p,a,b,mode='line'){
  const vx=b.x-a.x, vy=b.y-a.y;
  const len2=vx*vx+vy*vy;
  if(len2<1e-9) return null;
  let t=((p.x-a.x)*vx+(p.y-a.y)*vy)/len2;
  if(mode==='segment') t=Math.max(0,Math.min(1,t));
  else if(mode==='ray') t=Math.max(0,t);
  return {x:a.x+t*vx,y:a.y+t*vy,t};
}

function lineLikeActions(){
  return actions.filter(a=>a.t==='l'||a.t==='r'||a.t==='s');
}

function baseLineActions(){
  const g=base();
  if(lesson===0){
    return [{t:'s',a:g.A,b:g.B,baseKey:'AB'}];
  }
  if(lesson===1){
    return [
      {t:'s',a:g.O,b:g.A,baseKey:'OA'},
      {t:'s',a:g.O,b:g.B,baseKey:'OB'}
    ];
  }
  if(lesson===2){
    return [{t:'l',a:g.NL1,b:g.NL2,baseKey:'NUMBERLINE'}];
  }
  if(lesson===3){
    return [
      {t:'s',a:g.V1,b:g.A1,baseKey:'A1'},
      {t:'s',a:g.V1,b:g.B1,baseKey:'B1'},
      {t:'s',a:g.V2,b:g.A2,baseKey:'A2'},
      {t:'s',a:g.V2,b:g.B2,baseKey:'B2'}
    ];
  }
  if(lesson===4){
    // 4번은 교과서 그림만 그대로 표시
    return [];
  }
  if(lesson===5){
    return [{t:'s',a:g.A,b:g.B,baseKey:'PERP_AB'}];
  }
  return [];
}
function selectableLineActions(){
  return [...baseLineActions(), ...lineLikeActions()];
}
function selectableIntersectionObjects(){
  return [...selectableLineActions(), ...actions.filter(a=>a.t==='arc')];
}
function sameSelectedLine(a,b){
  if(!a||!b) return false;
  if(a.baseKey || b.baseKey) return a.baseKey && b.baseKey && a.baseKey===b.baseKey;
  return a===b;
}

function distanceToLineAction(p,a){
  const vx=a.b.x-a.a.x, vy=a.b.y-a.a.y;
  const len2=vx*vx+vy*vy;
  if(len2<1e-9) return Infinity;
  let t=((p.x-a.a.x)*vx+(p.y-a.a.y)*vy)/len2;
  if(a.t==='s') t=Math.max(0,Math.min(1,t));
  else if(a.t==='r') t=Math.max(0,t);
  const q=pt(a.a.x+t*vx,a.a.y+t*vy);
  return dist(p,q);
}
function nearestLineAction(p,threshold=22){
  // 화면에서 느끼는 선택 범위가 확대/축소와 무관하도록 보정
  const worldThreshold=threshold/Math.max(viewScale,0.01);
  let best=null,bestD=worldThreshold;
  for(const a of selectableLineActions()){
    const dd=distanceToLineAction(p,a);
    if(dd<bestD){best=a;bestD=dd}
  }
  return best;
}

function distanceToArcAction(p,a){
  if(a.points && a.points.length>1){
    let best=Infinity;
    for(let i=0;i<a.points.length-1;i++){
      const q=projectToLine(p,a.points[i],a.points[i+1],'segment');
      if(q) best=Math.min(best,dist(p,q));
    }
    return best;
  }
  // 예전 형식의 호가 남아 있을 경우 원 둘레까지의 거리로 선택
  if(a.c && typeof a.r==='number') return Math.abs(dist(p,a.c)-a.r);
  return Infinity;
}
function nearestIntersectionObject(p,threshold=34){
  const worldThreshold=threshold/Math.max(viewScale,0.01);
  let best=null,bestD=worldThreshold;
  for(const a of selectableIntersectionObjects()){
    const dd=a.t==='arc'?distanceToArcAction(p,a):distanceToLineAction(p,a);
    if(dd<bestD){best=a;bestD=dd}
  }
  return best;
}

function nearestLinePoint(p, threshold=18){
  let best=null, bestD=threshold;
  for(const a of lineLikeActions()){
    const q=projectToLine(p,a.a,a.b,a.t==='s'?'segment':(a.t==='r'?'ray':'line'));
    if(!q) continue;
    const dd=dist(p,q);
    if(dd<bestD){best=pt(q.x,q.y);bestD=dd}
  }
  return best;
}

function lineIntersection(a1,a2,b1,b2,modeA='line',modeB='line'){
  const r={x:a2.x-a1.x,y:a2.y-a1.y};
  const s={x:b2.x-b1.x,y:b2.y-b1.y};
  const den=r.x*s.y-r.y*s.x;
  if(Math.abs(den)<1e-9) return null;
  const qp={x:b1.x-a1.x,y:b1.y-a1.y};
  const t=(qp.x*s.y-qp.y*s.x)/den;
  const u=(qp.x*r.y-qp.y*r.x)/den;
  if(modeA==='segment' && (t<0||t>1)) return null;
  if(modeA==='ray' && t<0) return null;
  if(modeB==='segment' && (u<0||u>1)) return null;
  if(modeB==='ray' && u<0) return null;
  return pt(a1.x+t*r.x,a1.y+t*r.y);
}


function objectMode(a){
  return a.t==='s'?'segment':(a.t==='r'?'ray':'line');
}
function arcSegments(a){
  const out=[];
  if(a.points && a.points.length>1){
    for(let i=0;i<a.points.length-1;i++) out.push([a.points[i],a.points[i+1]]);
  }
  return out;
}
function dedupePoints(pts,eps=4){
  const out=[];
  for(const p of pts){
    if(!out.some(q=>dist(p,q)<eps)) out.push(p);
  }
  return out;
}
function intersectionsBetweenObjects(a,b){
  // 직선류 - 직선류
  if(a.t!=='arc' && b.t!=='arc'){
    const q=lineIntersection(a.a,a.b,b.a,b.b,objectMode(a),objectMode(b));
    return q?[q]:[];
  }

  // 직선류 - 호
  if(a.t!=='arc' && b.t==='arc'){
    const pts=[];
    for(const segm of arcSegments(b)){
      const q=lineIntersection(a.a,a.b,segm[0],segm[1],objectMode(a),'segment');
      if(q) pts.push(q);
    }
    return dedupePoints(pts);
  }
  if(a.t==='arc' && b.t!=='arc'){
    return intersectionsBetweenObjects(b,a);
  }

  // 호 - 호
  const pts=[];
  const aa=arcSegments(a), bb=arcSegments(b);
  for(const sa of aa){
    for(const sb of bb){
      const q=lineIntersection(sa[0],sa[1],sb[0],sb[1],'segment','segment');
      if(q) pts.push(q);
    }
  }
  return dedupePoints(pts);
}

function allIntersections(){
  const ls=lineLikeActions();
  const out=[];
  for(let i=0;i<ls.length;i++){
    for(let j=i+1;j<ls.length;j++){
      const q=lineIntersection(
        ls[i].a,ls[i].b,ls[j].a,ls[j].b,
        ls[i].t==='s'?'segment':(ls[i].t==='r'?'ray':'line'),
        ls[j].t==='s'?'segment':(ls[j].t==='r'?'ray':'line')
      );
      if(q && q.x>=0 && q.x<=W && q.y>=0 && q.y<=H) out.push(q);
    }
  }
  return out;
}

function nearestIntersection(p, threshold=32){
  let best=null,bestD=threshold;
  for(const q of allIntersections()){
    const dd=dist(p,q);
    if(dd<bestD){best=q;bestD=dd}
  }
  return best;
}

function smartPointSnap(p){
  // 우선순위: 기존 점 > 두 선의 교점 > 선 위의 최근접점
  const fixed=nearestSnap(p,24);
  if(fixed) return {p:pt(fixed.x,fixed.y),kind:'point'};
  const inter=nearestIntersection(p,32);
  if(inter) return {p:pt(inter.x,inter.y),kind:'intersection'};
  const onLine=nearestLinePoint(p,18);
  if(onLine) return {p:pt(onLine.x,onLine.y),kind:'line'};
  return {p,kind:'free'};
}

function seg(a,b,c='#222',w=2){

}

function arrowHead(p,dir,col='#222',size=10){

  ctx.lineTo(p.x-size*Math.cos(a-.45),p.y-size*Math.sin(a-.45));

  ctx.closePath();ctx.fill();
}

function smallAngleArc(v,p1,p2,r=24,col='#666',fill=null){
  const a1=Math.atan2(p1.y-v.y,p1.x-v.x), a2=Math.atan2(p2.y-v.y,p2.x-v.x);
  let d=a2-a1; while(d<=-Math.PI)d+=2*Math.PI; while(d>Math.PI)d-=2*Math.PI;
  let end=a1+d;
  if(fill){
    ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(v.x,v.y);ctx.arc(v.x,v.y,r,a1,end,d<0);ctx.closePath();ctx.fill();
  }
  ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(v.x,v.y,r,a1,end,d<0);ctx.stroke();
}

}
function arcDraw(c,r,a1,a2,col='#3a7b67',w=2.4){
 ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.arc(c.x,c.y,r,a1,a2,a2<a1);ctx.stroke()

function arcPath(points,col='#3a7b67',w=2.4){
 if(!points || points.length<2) return;
 ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();
 ctx.moveTo(points[0].x, points[0].y);

}
function lineDist(p,a,b){
 let A=p.x-a.x,B=p.y-a.y,C=b.x-a.x,D=b.y-a.y,z=C*C+D*D,t=z?(A*C+B*D)/z:0;
 t=Math.max(0,Math.min(1,t)); return Math.hypot(p.x-(a.x+t*C),p.y-(a.y+t*D))
}

   if(compassMode==='move'){
      // 바늘점/연필점/몸통 주변 모두 이동으로 인식
      const mx=(compass.center.x+compass.pencil.x)/2,my=(compass.center.y+compass.pencil.y)/2;
      if(hit(p,compass.center,28)||hit(p,compass.pencil,28)||dist(p,pt(mx,my-25))<55){
        drag={type:'move',start:p,c0:{...compass.center},p0:{...compass.pencil}}
      }
   }else if(compassMode==='open'){
      if(hit(p,compass.pencil,34))drag={type:'open'}
   }else if(compassMode==='arc'){
      if(hit(p,compass.pencil,38)){
        let a0=angle(compass.center,compass.pencil);
        drag={type:'arc',a0,last:a0,current:a0,arcPoints:[pt(compass.pencil.x,compass.pencil.y)]}
      }
   }
 }
});

cv.addEventListener('pointermove',e=>{
 if(!drag)return;e.preventDefault();let p=pos(e);
 if(drag.type==='move'){
   let dx=p.x-drag.start.x,dy=p.y-drag.start.y;
   let newC=pt(clamp(drag.c0.x+dx,20,W-20),clamp(drag.c0.y+dy,20,H-20));
   let newP=pt(clamp(drag.p0.x+dx,20,W-20),clamp(drag.p0.y+dy,20,H-20));

   // 바늘점이 기존 점 가까이 오면 그 점에 자동 스냅
   const s=nearestSnap(newC,24);
   if(s){
     const sx=s.x-newC.x, sy=s.y-newC.y;
     newC=pt(s.x,s.y);
     newP=pt(newP.x+sx,newP.y+sy);
     snapTarget=s;
   }else{
     snapTarget=null;
   }

   compass.center=newC;
   compass.pencil=newP;
 }else if(drag.type==='open'){
   // 중심은 고정, 연필점만 이동하되 기존 점 근처에서는 그 점으로 스냅
   const s=nearestSnap(p,24);
   if(s){
     compass.pencil=pt(s.x,s.y);
     snapTarget=s;
   }else{
     compass.pencil=p;
     snapTarget=null;
   }
 }else if(drag.type==='arc'){
   snapTarget=null;
   const r=dist(compass.center,compass.pencil);
   let a=angle(compass.center,p);
   drag.current=a;
   const nextP=pt(compass.center.x+r*Math.cos(a),compass.center.y+r*Math.sin(a));
   compass.pencil=nextP;

   if(!drag.arcPoints) drag.arcPoints=[pt(nextP.x,nextP.y)];
   const last=drag.arcPoints[drag.arcPoints.length-1];
   if(dist(last,nextP)>2){
     drag.arcPoints.push(pt(nextP.x,nextP.y));
   }
 }
 draw()
});

function finishDrag(){
 if(!drag)return;
 if(drag.type==='arc'){
   if(drag.arcPoints && drag.arcPoints.length>1){
     actions.push({
       t:'arc',
       c:{...compass.center},
       r:dist(compass.center,compass.pencil),
       points:drag.arcPoints.map(q=>pt(q.x,q.y)),
       col:selectedColor
     });
   }else{
     let da=normAng(drag.current-drag.a0);
     if(Math.abs(da)>.035){
       actions.push({t:'arc',c:{...compass.center},r:dist(compass.center,compass.pencil),a1:drag.a0,a2:drag.a0+da,col:selectedColor});
     }
   }
 }
 drag=null;
 snapTarget=null;
 draw()
}
cv.addEventListener('pointerup',finishDrag);cv.addEventListener('pointercancel',finishDrag);

function check(){
 let g=base();
 if(lesson===0){
   let target=dist(g.A,g.B);
   // P 중심, AB 반지름에 가까운 호가 있으면 핵심 성공
   let ok=actions.filter(x=>x.t==='arc').some(a=>dist(a.c,g.P)<30&&Math.abs(a.r-target)<22);
   setStatus(ok?'좋아요! AB의 길이를 P에 옮긴 호가 맞습니다.':'컴퍼스 간격을 AB에 맞춘 뒤 P로 이동하여 작은 호를 그어 보세요.',ok?'ok':'bad')
 }else if(lesson===1){
   // P 주변에 최소 2개의 사용자 직선이 원래 각과 비슷한 각을 만들면 성공
   let ls=actions.filter(x=>x.t==='l'||x.t==='r'||x.t==='s'),ok=false,orig=Math.PI/4;
   for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){
     if(lineDist(g.P,ls[i].a,ls[i].b)<30&&lineDist(g.P,ls[j].a,ls[j].b)<30){
       let a1=Math.atan2(ls[i].b.y-ls[i].a.y,ls[i].b.x-ls[i].a.x);
       let a2=Math.atan2(ls[j].b.y-ls[j].a.y,ls[j].b.x-ls[j].a.x);
       let ang=Math.abs(a1-a2)%Math.PI;ang=Math.min(ang,Math.PI-ang);
       if(Math.abs(ang-orig)<.12)ok=true
     }
   }
   setStatus(ok?'정답에 가까운 각이 만들어졌습니다!':'호의 교점 사이 거리를 옮겨 새 각의 방향을 잡아 보세요.',ok?'ok':'bad')
 }else if(lesson===5){
   const mid=pt((g.A.x+g.B.x)/2,(g.A.y+g.B.y)/2);
   let ok=false;
   for(const l of actions.filter(x=>x.t==='l'||x.t==='r'||x.t==='s')){
     if(lineDist(mid,l.a,l.b)<18){
       const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y;
       const abx=g.B.x-g.A.x,aby=g.B.y-g.A.y;
       const c=Math.abs((dx*abx+dy*aby)/(Math.hypot(dx,dy)*Math.hypot(abx,aby)));
       if(c<.12) ok=true;
     }
   }
   setStatus(ok?'정답입니다! 선분 AB의 수직이등분선입니다.':'A와 B를 중심으로 같은 반지름의 호를 그어 교점을 만든 뒤 연결해 보세요.',ok?'ok':'bad');
 }else{
   setStatus('이 탭은 교과서 그림을 보고 직접 작도하는 자유 연습용입니다.','ok');
 }
}

function setZoom(next){
  const old=viewScale;
  next=Math.max(0.6,Math.min(2.2,next));
  // 화면 중앙을 기준으로 확대/축소
  const cx=W/2, cy=H/2;
  const wx=(cx-viewX)/old, wy=(cy-viewY)/old;
  viewScale=next;
  viewX=cx-wx*viewScale;
  viewY=cy-wy*viewScale;
  zoomResetBtn.textContent=Math.round(viewScale*100)+'%';
  draw();
}

zoomInBtn.onclick=()=>setZoom(viewScale+0.2);
zoomOutBtn.onclick=()=>setZoom(viewScale-0.2);
zoomResetBtn.onclick=()=>{
  viewScale=1;viewX=0;viewY=0;zoomResetBtn.textContent='100%';draw();
};

t0.onclick=()=>setLesson(0);t1.onclick=()=>setLesson(1);t2.onclick=()=>setLesson(2);t3.onclick=()=>setLesson(3);t4.onclick=()=>setLesson(4);t5.onclick=()=>setLesson(5);

rayBtn.onclick=()=>setTool('ray');

compassBtn.onclick=()=>setTool('compass');
pointBtn.onclick=()=>setTool('point');

document.querySelectorAll('.colorBtn').forEach(btn=>{

    selectedColor=btn.dataset.color;

    setStatus('색상을 변경했습니다.');
    draw();
  };
});
cmMove.onclick=()=>setCompassMode('move');cmOpen.onclick=()=>setCompassMode('open');cmArc.onclick=()=>setCompassMode('arc');
undoBtn.onclick=()=>{if(actions.length)actions.pop();else pending=null;draw()};
resetBtn.onclick=()=>setLesson(lesson);checkBtn.onclick=check;
hintBtn.onclick=()=>{hintEl.hidden=false;hintEl.innerHTML='<b>힌트 '+(hintStep+1)+'</b><br>'+L[lesson].h[hintStep];hintStep=(hintStep+1)%L[lesson].h.length};


const shareOverlay=document.getElementById('shareOverlay');
const shareUrlInput=document.getElementById('shareUrlInput');
const qrBox=document.getElementById('qrBox');
const copyMsg=document.getElementById('copyMsg');

function currentShareUrl(){
  return location.protocol==='file:' ? '' : location.href.split('#')[0];
}
function openShareModal(){
  shareOverlay.classList.add('show');
  shareOverlay.setAttribute('aria-hidden','false');
  copyMsg.textContent='';
  const u=currentShareUrl();
  shareUrlInput.value=u;
  if(u){
    document.getElementById('shareInfo').textContent='이 주소를 학생들에게 QR코드나 링크로 공유하면 됩니다.';
    renderQr(u);
  }else{
    document.getElementById('shareInfo').textContent='지금은 PC의 파일로 열려 있어 학생들이 이 주소로 접속할 수 없습니다. 나중에 웹에 올린 주소를 아래 칸에 붙여 넣으면 QR코드를 만들 수 있습니다.';
    qrBox.textContent='웹주소를 입력한 뒤 QR 만들기를 눌러 주세요.';
  }
}
function closeShareModal(){
  shareOverlay.classList.remove('show');
  shareOverlay.setAttribute('aria-hidden','true');
}
function renderQr(url){
  qrBox.innerHTML='';
  if(!url){qrBox.textContent='공유할 웹주소를 입력해 주세요.';return;}
  const img=document.createElement('img');
  img.alt='학생 공유 QR코드';
  img.width=210; img.height=210;
  img.src='https://quickchart.io/qr?size=420&text='+encodeURIComponent(url);
  img.onerror=()=>{qrBox.textContent='QR코드를 불러오지 못했습니다. 링크 복사는 그대로 사용할 수 있습니다.';};
  qrBox.appendChild(img);
}
shareOpenBtn.onclick=openShareModal;
shareCloseBtn.onclick=closeShareModal;
makeQrBtn.onclick=()=>renderQr(shareUrlInput.value.trim());
copyLinkBtn.onclick=async()=>{
  const u=shareUrlInput.value.trim();
  if(!u){copyMsg.textContent='먼저 공유할 웹주소를 입력해 주세요.';return;}
  try{
    await navigator.clipboard.writeText(u);
    copyMsg.textContent='링크를 복사했습니다.';
  }catch(e){
    shareUrlInput.select();
    document.execCommand('copy');
    copyMsg.textContent='링크를 복사했습니다.';
  }
};
nativeShareBtn.onclick=async()=>{
  const u=shareUrlInput.value.trim();
  if(!u){copyMsg.textContent='먼저 공유할 웹주소를 입력해 주세요.';return;}
  if(navigator.share){
    try{await navigator.share({title:'자와 컴퍼스로 작도 연습',url:u});}catch(e){}
  }else{
    copyMsg.textContent='이 기기에서는 공유창을 지원하지 않습니다. 링크 복사를 사용해 주세요.';
  }
};
shareOverlay.addEventListener('click',e=>{if(e.target===shareOverlay)closeShareModal();});
fullscreenBtn.onclick=async()=>{
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
      fullscreenBtn.textContent='전체화면 종료';
    }else{
      await document.exitFullscreen();
    }
  }catch(e){}
};
document.addEventListener('fullscreenchange',()=>{
  fullscreenBtn.textContent=document.fullscreenElement?'전체화면 종료':'전체화면';
});

textbook4Img.onload=()=>draw();
setLesson(0);setTool('line');resize();
</script>
